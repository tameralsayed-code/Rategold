<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر تطبيقاتي | App Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- مكتبات Firebase المتوافقة مع HTML (الإصدار 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>

    <style>
        /* ================= نفس تصميم المتجر الفاخر ================= */
        :root { --bg-color: #0b1121; --glass-bg: rgba(30, 41, 59, 0.5); --glass-border: rgba(255, 255, 255, 0.08); --text-main: #f8fafc; --text-muted: #94a3b8; --accent-gold: #d4a019; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; min-height: 100vh; }
        .bg-glow { position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.3; }
        .glow-1 { top: -50px; right: -50px; width: 300px; height: 300px; background: #3b82f6; }
        .glow-2 { bottom: 0; left: -50px; width: 250px; height: 250px; background: var(--accent-gold); }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(11, 17, 33, 0.8); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--glass-border); }
        .logo { font-size: 18px; font-weight: 800; color: #fff; cursor: pointer; user-select: none; }
        .hero { text-align: center; padding: 30px 20px 20px; }
        .hero h1 { font-size: 26px; font-weight: 800; margin-bottom: 10px; }
        .hero p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
        .search-box { max-width: 350px; margin: 0 auto; position: relative; }
        .search-box input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); padding: 12px 40px 12px 15px; border-radius: 14px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: var(--accent-gold); background: rgba(255,255,255,0.1); }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: var(--text-muted); }
        .filters { display: flex; justify-content: center; gap: 8px; margin: 20px 0; padding: 0 15px; }
        .filter-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted); padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .filter-btn.active { background: #fff; color: #000; }
        .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; padding: 0 15px 40px; max-width: 900px; margin: 0 auto; }
        .app-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; position: relative; animation: fadeUp 0.4s ease backwards; }
        .app-card:active { transform: scale(0.97); }
        .app-icon { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .app-info { flex-grow: 1; }
        .app-info h3 { font-size: 15px; font-weight: 800; margin-bottom: 3px; color: #fff; }
        .app-category { font-size: 11px; color: var(--text-muted); background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 6px; display: inline-block; margin-bottom: 4px; }
        .app-desc-short { font-size: 12px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .enter-icon { width: 20px; height: 20px; fill: var(--text-muted); opacity: 0.5; }
        .no-results { text-align: center; grid-column: 1 / -1; padding: 30px; font-size: 14px; color: var(--text-muted); display: none; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* صفحة التطبيق الداخلية */
        .app-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 1000; display: none; flex-direction: column; overflow-y: auto; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .page-header { position: sticky; top: 0; background: rgba(11, 17, 33, 0.9); backdrop-filter: blur(10px); padding: 15px 20px; display: flex; align-items: center; border-bottom: 1px solid var(--glass-border); z-index: 10; }
        .back-btn { background: none; border: none; color: #fff; display: flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .back-btn svg { width: 20px; height: 20px; fill: #fff; transform: rotate(180deg); }
        .page-content { padding: 25px 20px 100px; max-width: 600px; margin: 0 auto; width: 100%; }
        .app-header-details { display: flex; gap: 20px; align-items: center; margin-bottom: 30px; }
        .app-header-details img { width: 90px; height: 90px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .app-header-text h2 { font-size: 22px; font-weight: 800; margin-bottom: 5px; }
        .app-header-text .cat { font-size: 13px; color: var(--accent-gold); font-weight: 600; margin-bottom: 5px; }
        .app-header-text .meta { font-size: 12px; color: var(--text-muted); }
        .desc-box { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .desc-box h4 { font-size: 16px; margin-bottom: 10px; color: #fff; }
        .desc-box p { font-size: 14px; color: var(--text-muted); line-height: 1.8; white-space: pre-line; }
        .download-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(11, 17, 33, 0.95); backdrop-filter: blur(15px); border-top: 1px solid var(--glass-border); padding: 15px 20px; display: flex; justify-content: center; z-index: 10; }
        .download-btn { width: 100%; max-width: 500px; background: linear-gradient(135deg, var(--accent-gold) 0%, #b4850d 100%); color: #fff; text-align: center; text-decoration: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 800; box-shadow: 0 5px 15px rgba(212, 160, 25, 0.3); transition: 0.2s; border: none; cursor: pointer; }
        .download-btn:active { transform: scale(0.96); }

        /* لوحة التحكم الخفية */
        .admin-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 2000; display: none; flex-direction: column; overflow-y: auto; padding: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; margin-bottom: 20px; }
        .admin-header h2 { color: var(--accent-gold); font-size: 18px; }
        .admin-close { background: var(--danger); color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 10px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent-gold); }
        .form-row { display: flex; gap: 10px; }
        .admin-list { margin-top: 20px; border-top: 1px solid var(--glass-border); padding-top: 20px; }
        .admin-app-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .admin-app-item .app-name { font-size: 14px; font-weight: bold; }
        .admin-app-item button { background: var(--danger); border: none; color: #fff; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .loading-db { text-align: center; color: var(--accent-gold); font-weight: bold; padding: 40px; grid-column: 1/-1;}
    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <nav>
        <!-- اضغط على الشعار 5 مرات لفتح لوحة التحكم -->
        <div class="logo" id="secretLogo">متجر تطبيقاتي</div>
    </nav>

    <div id="storeView">
        <section class="hero">
            <h1>أحدث التطبيقات</h1>
            <p>تطبيقات إسلامية وأدوات متنوعة بروابط مباشرة</p>
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="ابحث عن تطبيق..." onkeyup="filterApps()">
            </div>
        </section>

        <div class="filters">
            <button class="filter-btn active" onclick="setCategory('all', this)">الكل</button>
            <button class="filter-btn" onclick="setCategory('islamic', this)">إسلامي</button>
            <button class="filter-btn" onclick="setCategory('various', this)">متنوع</button>
        </div>

        <main class="apps-grid" id="appsContainer">
            <div class="loading-db">جاري جلب التطبيقات من قاعدة البيانات...</div>
        </main>
        <div class="no-results" id="noResultsMsg">لا توجد تطبيقات تطابق بحثك</div>
    </div>

    <!-- صفحة التطبيق الداخلية -->
    <div class="app-page" id="appPage">
        <div class="page-header">
            <button class="back-btn" onclick="closeApp()"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg> رجوع</button>
        </div>
        <div class="page-content">
            <div class="app-header-details">
                <img id="pageIcon" src="" alt="Icon">
                <div class="app-header-text">
                    <h2 id="pageTitle"></h2>
                    <div class="cat" id="pageCat"></div>
                    <div class="meta">الإصدار: <span id="pageVer"></span> • الحجم: <span id="pageSize"></span></div>
                </div>
            </div>
            <div class="desc-box">
                <h4>عن التطبيق</h4>
                <p id="pageDesc"></p>
            </div>
        </div>
        <div class="download-bar">
            <a href="#" id="pageDownloadBtn" target="_blank" class="download-btn">تنزيل (APK)</a>
        </div>
    </div>

    <!-- لوحة التحكم الخفية -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h2>⚙️ لوحة التحكم (Firebase)</h2>
            <button class="admin-close" onclick="closeAdmin()">إغلاق</button>
        </div>

        <div class="form-group">
            <label>اسم التطبيق</label>
            <input type="text" id="addTitle" placeholder="مثال: القرآن الكريم">
        </div>
        <div class="form-row">
            <div class="form-group" style="flex:1;">
                <label>التصنيف</label>
                <select id="addCat">
                    <option value="islamic">إسلامي</option>
                    <option value="various">متنوع</option>
                </select>
            </div>
            <div class="form-group" style="flex:1;">
                <label>الإصدار</label>
                <input type="text" id="addVer" placeholder="1.0">
            </div>
            <div class="form-group" style="flex:1;">
                <label>الحجم</label>
                <input type="text" id="addSize" placeholder="15 MB">
            </div>
        </div>
        <div class="form-group">
            <label>رابط صورة الأيقونة</label>
            <input type="text" id="addIcon" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>رابط التحميل (APK)</label>
            <input type="text" id="addApk" placeholder="رابط مباشر للتطبيق">
        </div>
        <div class="form-group">
            <label>وصف قصير (للقائمة)</label>
            <input type="text" id="addShortDesc" placeholder="سطر واحد يعبر عن التطبيق">
        </div>
        <div class="form-group">
            <label>الوصف الكامل</label>
            <textarea id="addFullDesc" style="height:60px;" placeholder="اكتب وصف التطبيق..."></textarea>
        </div>
        <button class="download-btn" id="addBtn" style="width:100%; border:none; cursor:pointer;" onclick="addNewApp()">➕ إضافة التطبيق ونشره فوراً</button>

        <div class="admin-list" id="adminList">
            <!-- قائمة التطبيقات للحذف -->
        </div>
    </div>

    <script>
        // =======================================================
        // 🌟 إعدادات Firebase الجديدة الخاصة بك 🌟
        // =======================================================
        const firebaseConfig = {
          apiKey: "AIzaSyCYoLXEu4qmMzGL9_5wyoPK-rRLnNMhAzw",
          authDomain: "web-app-55b39.firebaseapp.com",
          projectId: "web-app-55b39",
          storageBucket: "web-app-55b39.firebasestorage.app",
          messagingSenderId: "986601312549",
          appId: "1:986601312549:web:059468f1f7616e926e0acc",
          measurementId: "G-CFJCQ3L5J9"
        };
        // =======================================================

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        firebase.analytics(); // تفعيل التحليلات بناءً على الكود الذي أرسلته
        const db = firebase.firestore();

        let appsData = [];
        let currentCategory = 'all';

        const appsContainer = document.getElementById('appsContainer');
        const adminList = document.getElementById('adminList');
        const searchInput = document.getElementById('searchInput');
        const noResultsMsg = document.getElementById('noResultsMsg');

        // جلب البيانات لحظياً من Firebase (Real-time Listener)
        db.collection("apps").orderBy("timestamp", "desc").onSnapshot((querySnapshot) => {
            appsData = [];
            querySnapshot.forEach((doc) => {
                appsData.push({ id: doc.id, ...doc.data() });
            });
            renderApps();
            renderAdminApps();
        }, (error) => {
            console.error("خطأ في جلب البيانات: ", error);
            appsContainer.innerHTML = `<div class="loading-db" style="color:red;">حدث خطأ في الاتصال بقاعدة البيانات. تأكد من إعدادات Firestore.</div>`;
        });

        // دالة لعرض التطبيقات في المتجر
        function renderApps() {
            appsContainer.innerHTML = '';
            let filteredApps = appsData.filter(app => {
                const matchCategory = currentCategory === 'all' || app.category === currentCategory;
                const matchSearch = app.title.toLowerCase().includes(searchInput.value.toLowerCase());
                return matchCategory && matchSearch;
            });

            if (filteredApps.length === 0) {
                noResultsMsg.style.display = 'block';
            } else {
                noResultsMsg.style.display = 'none';
                filteredApps.forEach(app => {
                    const catName = app.category === 'islamic' ? 'إسلامي' : 'متنوع';
                    const appCard = document.createElement('div');
                    appCard.className = 'app-card';
                    appCard.onclick = () => openApp(app);
                    appCard.innerHTML = `
                        <img src="${app.icon}" class="app-icon" alt="icon" onerror="this.src='https://via.placeholder.com/150/1e293b/FFFFFF?text=App'">
                        <div class="app-info">
                            <h3>${app.title}</h3>
                            <div class="app-category">${catName}</div>
                            <div class="app-desc-short">${app.shortDesc}</div>
                        </div>
                        <svg class="enter-icon" viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
                    `;
                    appsContainer.appendChild(appCard);
                });
            }
        }

        // دوال التصفية والبحث
        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderApps();
        }

        function filterApps() {
            renderApps();
        }

        // عرض صفحة التطبيق
        function openApp(app) {
            document.getElementById('pageIcon').src = app.icon;
            document.getElementById('pageTitle').innerText = app.title;
            document.getElementById('pageCat').innerText = app.category === 'islamic' ? 'إسلامي' : 'متنوع';
            document.getElementById('pageVer').innerText = app.version;
            document.getElementById('pageSize').innerText = app.size;
            document.getElementById('pageDesc').innerText = app.fullDesc;
            document.getElementById('pageDownloadBtn').href = app.apkLink;
            
            document.getElementById('appPage').style.display = 'flex';
        }

        function closeApp() {
            document.getElementById('appPage').style.display = 'none';
        }

        // =======================================================
        // جزء لوحة التحكم
        // =======================================================

        // فتح لوحة التحكم بالضغط 5 مرات على الشعار
        let clickCount = 0;
        document.getElementById('secretLogo').addEventListener('click', () => {
            clickCount++;
            if(clickCount >= 5) {
                document.getElementById('adminPanel').style.display = 'flex';
                clickCount = 0;
            }
            setTimeout(() => clickCount = 0, 3000); // إعادة التعيين بعد 3 ثواني
        });

        function closeAdmin() {
            document.getElementById('adminPanel').style.display = 'none';
        }

        // إضافة تطبيق جديد لقاعدة البيانات
        function addNewApp() {
            const title = document.getElementById('addTitle').value;
            const category = document.getElementById('addCat').value;
            const version = document.getElementById('addVer').value;
            const size = document.getElementById('addSize').value;
            const icon = document.getElementById('addIcon').value;
            const apkLink = document.getElementById('addApk').value;
            const shortDesc = document.getElementById('addShortDesc').value;
            const fullDesc = document.getElementById('addFullDesc').value;

            if(!title || !icon || !apkLink) {
                alert('يرجى ملء الاسم، رابط الأيقونة، ورابط التحميل على الأقل!');
                return;
            }

            const addBtn = document.getElementById('addBtn');
            addBtn.innerText = 'جاري الإضافة...';
            addBtn.disabled = true;

            db.collection("apps").add({
                title: title,
                category: category,
                version: version || '1.0',
                size: size || 'Unknown',
                icon: icon,
                apkLink: apkLink,
                shortDesc: shortDesc,
                fullDesc: fullDesc,
                timestamp: firebase.firestore.FieldValue.serverTimestamp() // ترتيب حسب الأحدث
            })
            .then(() => {
                alert("تم إضافة التطبيق بنجاح!");
                // تفريغ الحقول
                document.querySelectorAll('.admin-panel input, .admin-panel textarea').forEach(input => input.value = '');
                addBtn.innerText = '➕ إضافة التطبيق ونشره فوراً';
                addBtn.disabled = false;
            })
            .catch((error) => {
                console.error("خطأ:", error);
                alert("حدث خطأ أثناء الإضافة.");
                addBtn.innerText = '➕ إضافة التطبيق ونشره فوراً';
                addBtn.disabled = false;
            });
        }

        // عرض التطبيقات في لوحة التحكم للحذف
        function renderAdminApps() {
            adminList.innerHTML = '<h3 style="color:#fff; margin-bottom:10px; font-size:14px;">التطبيقات الحالية:</h3>';
            if(appsData.length === 0) {
                adminList.innerHTML += '<p style="color:gray; font-size:12px;">لا يوجد تطبيقات حالياً.</p>';
            }
            appsData.forEach(app => {
                const item = document.createElement('div');
                item.className = 'admin-app-item';
                item.innerHTML = `
                    <div class="app-name">${app.title}</div>
                    <button onclick="deleteApp('${app.id}')">حذف 🗑️</button>
                `;
                adminList.appendChild(item);
            });
        }

        // حذف التطبيق من قاعدة البيانات
        function deleteApp(id) {
            if(confirm('هل أنت متأكد من حذف هذا التطبيق نهائياً؟')) {
                db.collection("apps").doc(id).delete()
                .then(() => {
                    console.log("تم الحذف");
                })
                .catch((error) => {
                    console.error("خطأ في الحذف:", error);
                });
            }
        }

    </script>
</body>
</html>
